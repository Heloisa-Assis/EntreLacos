    <main>

    <div class="formulario">

    <h2>Precisa de ajuda?</h2>
    <p>Nos conte do que você precisa e encontre alguém que possa ajudar.</p>


    <form>

        <label for="nome">Nome (opcional)</label>
        <input type="text" id="nome" placeholder="Como podemos chamar você?">

        <label for="pedido">Do que você precisa?</label>
        <textarea id="pedido" placeholder="Conte brevemente o que você precisa..." required></textarea>

        <label for="local">Onde você está?</label>
        <input type="text" id="local" placeholder="Cidade ou bairro" required>

        <label for="contato">Contato</label>
        <input type="text" id="contato" placeholder="E-mail ou telefone">

        <label>
            <input type="checkbox" class="check">
            Quero fazer este pedido anonimamente
        </label>

        <button type="submit" class="pedido-btn">Publicar pedido</button>

    </form>

</div>
